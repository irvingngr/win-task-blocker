name: Build Win Task Blocker (Windows x64)

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WinTaskBlocker.csproj

      - name: Publish Fast-Boot ReadyToRun Portable Executable (win-x64)
        run: |
          dotnet publish WinTaskBlocker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -o publish/WinTaskBlocker_v2.0.6_Portable
          Compress-Archive -Path publish/WinTaskBlocker_v2.0.6_Portable/* -DestinationPath publish/WinTaskBlocker-v2.0.6-win-x64-Portable.zip -Force

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTaskBlocker-v2.0.6-Windows-x64-Portable
          path: |
            publish/WinTaskBlocker_v2.0.6_Portable/WinTaskBlocker.exe
            publish/WinTaskBlocker_v2.0.6_Portable/config.ini
            publish/WinTaskBlocker_v2.0.6_Portable/Assets/app.ico
            publish/WinTaskBlocker-v2.0.6-win-x64-Portable.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Win Task Blocker ${{ github.ref_name }}"
          body: |
            ## 🛡️ Win Task Blocker ${{ github.ref_name }}

            Modern, ultra-lightweight process blocker, conditional dependency guardian, Windows startup manager, and Hosts file manager for Windows 10 & Windows 11.

            ### 🚀 What's New in ${{ github.ref_name }}
            - 🚀 **Complete Windows Task Manager Startup Parity**: `StartupManagerService` now enumerates and toggles **all** Windows Task Manager startup sources:
              - **64-bit Registry Run**: `HKCU\...\Run` & `HKLM\...\Run` synced with `StartupApproved\Run`.
              - **32-bit WOW64 Registry Run**: `HKLM\SOFTWARE\WOW6432Node\...\Run` synced with `StartupApproved\Run32`.
              - **User & Common Startup Folders**: Both `%APPDATA%\...\Startup` and `%ProgramData%\...\Startup` (`CommonStartup`) synced natively via `StartupApproved\StartupFolder`.
              - **UWP / MSIX Packaged Apps**: Detects Store/MSIX startup tasks under `AppModel\SystemAppData`, resolves friendly display names (including `SHLoadIndirectString` / `AppxManifest.xml`) and native icons, and toggles each via `State` (`EnabledByUser` / `DisabledByUser`).
            - 🔍 **Enhanced Startup Search & UX**: Expanded startup search to match executable paths and UWP package family names, added full tooltips, widened source badges, and gracefully handles protected/policy-locked toggle errors.
            - 💠 **Acrylic Glass Edition**: Native Windows 10/11 DWM Acrylic Blur, 4 dynamic crystal themes, ReadyToRun fast boot, Admin Hosts File Manager, and bilingual English / Spanish UI (`EN` / `ES`).
            - 👤 **About & Credits**: Crafted by **Irving Ngr** 🇻🇪 • 100% compatible with legacy `config.ini` (`True|process.exe|count`).
          files: |
            publish/WinTaskBlocker-v2.0.6-win-x64-Portable.zip
            publish/WinTaskBlocker_v2.0.6_Portable/WinTaskBlocker.exe
            publish/WinTaskBlocker_v2.0.6_Portable/config.ini
