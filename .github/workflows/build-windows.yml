name: Build Win Task Blocker (Windows x64)

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WinTaskBlocker.csproj

      - name: Publish Fast-Boot ReadyToRun Portable Executable (win-x64)
        run: |
          dotnet publish WinTaskBlocker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -o publish/WinTaskBlocker_v2.0.3_Portable
          Compress-Archive -Path publish/WinTaskBlocker_v2.0.3_Portable/* -DestinationPath publish/WinTaskBlocker-v2.0.3-win-x64-Portable.zip -Force

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTaskBlocker-v2.0.3-Windows-x64-Portable
          path: |
            publish/WinTaskBlocker_v2.0.3_Portable/WinTaskBlocker.exe
            publish/WinTaskBlocker_v2.0.3_Portable/config.ini
            publish/WinTaskBlocker_v2.0.3_Portable/Assets/app.ico
            publish/WinTaskBlocker-v2.0.3-win-x64-Portable.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Win Task Blocker ${{ github.ref_name }}"
          body: |
            ## 🛡️ Win Task Blocker ${{ github.ref_name }}

            Modern, ultra-lightweight process blocker, conditional dependency guardian, and Windows startup manager for Windows 10 & Windows 11.

            ### 🚀 What's New in ${{ github.ref_name }}
            - ⚡ **Instant Cold-Boot & Native Splash Screen**: Precompiled with **ReadyToRun (R2R)** native x64 code, non-blocking background `.exe` icon resolution, and a native **Splash Screen** featuring the official Win Task Blocker logo.
            - 🔇 **Run on Windows Startup (Minimized) & Auto-Block**: Added **"Run on Windows startup (minimized)"** option and guaranteed automatic **Block Enabled** state on startup (even if previously stopped).
            - 💠 **Default 40% Windows Blue Crystal & Dynamic Theme Accents**: Defaults to **40% Opacity — Windows Blue**. Switching crystal finishes (**Windows Blue**, **Purple Nebula**, **Midnight Dark**, **Arctic Cyan**) now dynamically updates all button borders, selected rows, badges, and accented texts across the entire UI.
            - 🎯 **Streamlined Controls & Default Profiles**: Simplified status/action labels (**Block Enabled**, **Block Disabled**, **Start**, **Stop** / **Bloqueo Activo**, **Bloqueo Desactivado**, **Iniciar**, **Detener**) and preconfigured **Adobe Suite** & **Gaming / Focus Mode** conditional profiles.
            - 🌐 **Bilingual Interface (English & Spanish)**: Starts in **English** by default with an instant **flag toggle button** in the top titlebar (`EN` / `ES`).
            - 👤 **About & Credits**: Crafted by **Irving Ngr** 🇻🇪 • 100% compatible with legacy `config.ini` (`True|process.exe|count`).
          files: |
            publish/WinTaskBlocker-v2.0.3-win-x64-Portable.zip
            publish/WinTaskBlocker_v2.0.3_Portable/WinTaskBlocker.exe
            publish/WinTaskBlocker_v2.0.3_Portable/config.ini
